name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
      pages: write
    outputs:
      semver: ${{ steps.metadata.outputs.semver }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Tag 必须使用 vX.Y.Z 格式。"
          }
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_NAME) -or [string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw "请配置 MSIX_PACKAGE_NAME 和 MSIX_PUBLISHER 仓库变量。"
          }
          $semver = $env:GITHUB_REF_NAME.TrimStart('v')
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "version=$semver.0" >> $env:GITHUB_OUTPUT

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "请配置 MSIX_SIGNING_PFX_BASE64 仓库 Secret。"
          }
          New-Item -ItemType Directory -Path dist/cert -Force | Out-Null
          [IO.File]::WriteAllBytes("dist/cert/release.pfx", [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Test
        shell: pwsh
        run: .\scripts\test.ps1 -Configuration Release

      - name: Package signed MSIX
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
          PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            throw "请配置 MSIX_SIGNING_PFX_PASSWORD 仓库 Secret。"
          }
          .\scripts\package.ps1 `
            -Version $env:VERSION `
            -PackageName $env:PACKAGE_NAME `
            -Publisher $env:PUBLISHER `
            -Sign `
            -CertPath "dist/cert/release.pfx" `
            -CertPassword $env:CERT_PASSWORD

      - name: Export public certificate
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "dist/cert/release.pfx",
            $env:CERT_PASSWORD,
            $flags)
          if ($certificate.Subject -ne $env:PUBLISHER) {
            throw "签名证书主题与 MSIX_PUBLISHER 不匹配：$($certificate.Subject)"
          }
          [IO.File]::WriteAllBytes(
            "dist/site/AirScreenshot.cer",
            $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      - name: Validate release package
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          .\scripts\validate-package.ps1 `
            -Version $env:VERSION `
            -PackageName $env:PACKAGE_NAME `
            -Publisher $env:PUBLISHER

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ steps.metadata.outputs.semver }}
        run: |
          $assets = @(
            "dist/site/AirScreenshot-$env:SEMVER.msix",
            "dist/site/AirScreenshot.appinstaller",
            "dist/site/AirScreenshot.cer",
            "dist/site/Install-AirScreenshot.ps1"
          )
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --title "Air Screenshot $env:SEMVER" `
              --generate-notes `
              --notes "首次安装请运行 Install-AirScreenshot.ps1。之后由 Windows 静默更新，无需重复安装。"
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
