name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.RELEASE_PUBLISHER || vars.MSIX_PUBLISHER }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Tag 必须使用 vX.Y.Z 格式。"
          }
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw "请配置 RELEASE_PUBLISHER 仓库变量。"
          }
          "version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 || secrets.MSIX_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "请配置 CODE_SIGNING_PFX_BASE64 仓库 Secret。"
          }
          New-Item -ItemType Directory -Path dist/cert -Force | Out-Null
          [IO.File]::WriteAllBytes("dist/cert/release.pfx", [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Test
        shell: pwsh
        run: .\scripts\test.ps1 -Configuration Release

      - name: Package signed portable EXE
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD || secrets.MSIX_SIGNING_PFX_PASSWORD }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            throw "请配置 CODE_SIGNING_PFX_PASSWORD 仓库 Secret。"
          }
          .\scripts\package.ps1 `
            -Version $env:VERSION `
            -Sign `
            -CertPath "dist/cert/release.pfx" `
            -CertPassword $env:CERT_PASSWORD

      - name: Validate portable release
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.RELEASE_PUBLISHER || vars.MSIX_PUBLISHER }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          .\scripts\validate-package.ps1 -Version $env:VERSION -Publisher $env:PUBLISHER
          .\scripts\smoke-portable.ps1 -Executable "dist/site/AirScreenshot.exe"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $asset = "dist/site/AirScreenshot.exe"
          $ocrHelper = "dist/site/airshot_ocr.exe"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
            gh release upload $env:GITHUB_REF_NAME $ocrHelper --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset $ocrHelper `
              --verify-tag `
              --title "Air Screenshot $env:VERSION" `
              --generate-notes `
              --notes "下载 AirScreenshot.exe 和 airshot_ocr.exe，放在同一目录后双击即可运行，无需安装。"
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public download entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort')"
          test "$assets" = '["AirScreenshot.exe","airshot_ocr.exe"]'

          expected_version="${GITHUB_REF_NAME#v}"
          for attempt in {1..30}; do
            if curl -fsS -H 'Cache-Control: no-cache' -o latest.json "https://mmm1h.github.io/air-screenshot/latest.json" &&
               curl -fsS -H 'Cache-Control: no-cache' -o index.html "https://mmm1h.github.io/air-screenshot/" &&
               curl -fsS -H 'Cache-Control: no-cache' -o airshot_ocr.exe "https://mmm1h.github.io/air-screenshot/airshot_ocr.exe"; then
              actual_version="$(jq -r '.version' latest.json)"
              download_url="$(jq -r '.url' latest.json)"
              expected_sha256="$(jq -r '.sha256 | ascii_downcase' latest.json)"
              expected_size="$(jq -r '.size' latest.json)"
              rm -f AirScreenshot.exe
              curl -fsS -H 'Cache-Control: no-cache' -o AirScreenshot.exe "$download_url" || true
              actual_sha256="$(sha256sum AirScreenshot.exe 2>/dev/null | cut -d' ' -f1 || true)"
              actual_size="$(stat -c%s AirScreenshot.exe 2>/dev/null || true)"
              if [[ "$actual_version" = "$expected_version" ]] &&
                 [[ "$download_url" = "https://mmm1h.github.io/air-screenshot/AirScreenshot.exe" ]] &&
                 [[ "$actual_sha256" = "$expected_sha256" ]] &&
                 [[ "$actual_size" = "$expected_size" ]] &&
                 [[ -s airshot_ocr.exe ]] &&
                 grep -q "AirScreenshot.exe" index.html &&
                 grep -q "airshot_ocr.exe" index.html &&
                 ! grep -Eqi 'msix|appinstaller|Install-AirScreenshot' index.html; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "公开下载页或 latest.json 未更新到 $expected_version。" >&2
          exit 1
