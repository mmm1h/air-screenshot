name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: air-screenshot-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Rust for the native OCR worker
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup component add clippy rustfmt --toolchain 1.88.0-x86_64-pc-windows-msvc
          rustup override set 1.88.0

      - name: Validate release metadata
        id: metadata
        shell: pwsh
        run: |
          . .\scripts\version.ps1
          if (-not $env:GITHUB_REF_NAME.StartsWith(
                  "v",
                  [StringComparison]::Ordinal
              )) {
            throw "Tag 必须使用 vX.Y.Z 格式。"
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $null = ConvertTo-AirshotVersion -Version $tagVersion -Subject "Tag 版本"
          $sourceVersion = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          $null = ConvertTo-AirshotVersion -Version $sourceVersion -Subject "VERSION"
          if ($sourceVersion -ne $tagVersion) {
            throw "Tag 版本 $tagVersion 与 VERSION 文件 $sourceVersion 不一致。"
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Build and test Debug and Release
        shell: pwsh
        env:
          OCR_MANIFEST_KEY_ID: ${{ vars.OCR_MANIFEST_KEY_ID }}
          OCR_MANIFEST_PUBLIC_KEY_HEX: ${{ vars.OCR_MANIFEST_PUBLIC_KEY_HEX }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCR_MANIFEST_KEY_ID) -or
              [string]::IsNullOrWhiteSpace($env:OCR_MANIFEST_PUBLIC_KEY_HEX)) {
            throw "请配置 OCR_MANIFEST_KEY_ID 和 OCR_MANIFEST_PUBLIC_KEY_HEX 仓库变量。"
          }
          .\scripts\test.ps1 `
            -Configuration Debug,Release `
            -Version $env:VERSION `
            -OcrManifestKeyId $env:OCR_MANIFEST_KEY_ID `
            -OcrManifestPublicKeyHex $env:OCR_MANIFEST_PUBLIC_KEY_HEX

      - name: Prepare OCR dependencies
        shell: pwsh
        run: .\scripts\prepare-ocr-dependencies.ps1

      - name: Stage unsigned release input
        shell: pwsh
        run: |
          $inputRoot = "dist/release-input"
          New-Item -ItemType Directory -Path $inputRoot -Force | Out-Null
          Copy-Item "build/release/bin/AirScreenshot.exe" $inputRoot
          Copy-Item "build/release/symbols/AirScreenshot.pdb" $inputRoot
          Copy-Item "dist/ocr-dependencies" "$inputRoot/ocr-dependencies" -Recurse
          .\scripts\release-input-manifest.ps1 -Root $inputRoot

      - name: Attest unsigned release input
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/release-input/release-input.sha256.json

      - name: Upload unsigned release input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-input-${{ github.run_id }}
          path: dist/release-input
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign and validate
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    environment:
      name: release-signing
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download unsigned release input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-input-${{ github.run_id }}
          path: dist/release-input

      - name: Verify unsigned release input provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify `
            "dist/release-input/release-input.sha256.json" `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "github.com/$env:GITHUB_REPOSITORY/.github/workflows/release.yml" `
            --source-ref $env:GITHUB_REF `
            --source-digest $env:GITHUB_SHA
          .\scripts\release-input-manifest.ps1 `
            -Root "dist/release-input" `
            -Verify

      - name: Sign and package
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
          OCR_MANIFEST_KEY_ID: ${{ vars.OCR_MANIFEST_KEY_ID }}
          OCR_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.OCR_MANIFEST_PRIVATE_KEY_PEM }}
          OCR_MANIFEST_PUBLIC_KEY_HEX: ${{ vars.OCR_MANIFEST_PUBLIC_KEY_HEX }}
          TIMESTAMP_URL: ${{ vars.RELEASE_TIMESTAMP_URL }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $hasCodePfx = -not [string]::IsNullOrWhiteSpace(
            $env:CODE_SIGNING_PFX_BASE64
          )
          $hasCodePassword = -not [string]::IsNullOrWhiteSpace(
            $env:CODE_SIGNING_PFX_PASSWORD
          )
          $hasLegacyPfx = -not [string]::IsNullOrWhiteSpace(
            $env:MSIX_SIGNING_PFX_BASE64
          )
          $hasLegacyPassword = -not [string]::IsNullOrWhiteSpace(
            $env:MSIX_SIGNING_PFX_PASSWORD
          )
          if ($hasCodePfx -ne $hasCodePassword) {
            throw "CODE_SIGNING_PFX_BASE64 与 CODE_SIGNING_PFX_PASSWORD 必须成对配置。"
          }
          if ($hasLegacyPfx -ne $hasLegacyPassword) {
            throw "MSIX_SIGNING_PFX_BASE64 与 MSIX_SIGNING_PFX_PASSWORD 必须成对配置。"
          }
          if ($hasCodePfx) {
            $pfxBase64 = $env:CODE_SIGNING_PFX_BASE64
            $certPassword = $env:CODE_SIGNING_PFX_PASSWORD
          }
          elseif ($hasLegacyPfx) {
            $pfxBase64 = $env:MSIX_SIGNING_PFX_BASE64
            $certPassword = $env:MSIX_SIGNING_PFX_PASSWORD
          }
          else {
            throw "请配置完整的 CODE_SIGNING_PFX_* Secret 二元组。"
          }
          if ([string]::IsNullOrWhiteSpace($env:OCR_MANIFEST_PRIVATE_KEY_PEM)) {
            throw "请配置 OCR_MANIFEST_PRIVATE_KEY_PEM Secret。"
          }

          $pfx = Join-Path $env:RUNNER_TEMP "AirScreenshot.Release.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($pfxBase64))
            $package = @{
              Version = $env:VERSION
              SkipBuild = $true
              InputExecutable = "dist/release-input/AirScreenshot.exe"
              InputPdb = "dist/release-input/AirScreenshot.pdb"
              OcrSourceRoot = "dist/release-input/ocr-dependencies"
              OcrManifestKeyId = $env:OCR_MANIFEST_KEY_ID
              OcrManifestPublicKeyHex = $env:OCR_MANIFEST_PUBLIC_KEY_HEX
              OcrManifestPrivateKeyPem = $env:OCR_MANIFEST_PRIVATE_KEY_PEM
              Sign = $true
              CertPath = $pfx
              CertPassword = $certPassword
            }
            if (-not [string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
              $package.TimestampUrl = $env:TIMESTAMP_URL
            }
            .\scripts\package.ps1 @package
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Generate release SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: dist/site
          format: spdx-json
          output-file: dist/release-assets/AirScreenshot.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Add SBOM checksum
        shell: pwsh
        run: |
          $sbom = "dist/release-assets/AirScreenshot.spdx.json"
          $hash = (Get-FileHash -LiteralPath $sbom -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "dist/release-assets/SHA256SUMS.txt" "$hash *AirScreenshot.spdx.json" -Encoding ascii

      - name: Validate signed release
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.RELEASE_PUBLISHER || vars.MSIX_PUBLISHER }}
          OCR_MANIFEST_KEY_ID: ${{ vars.OCR_MANIFEST_KEY_ID }}
          OCR_MANIFEST_PUBLIC_KEY_HEX: ${{ vars.OCR_MANIFEST_PUBLIC_KEY_HEX }}
          REQUIRE_TRUSTED_SIGNATURE: ${{ vars.RELEASE_REQUIRE_TRUSTED_SIGNATURE }}
          SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw "请配置 RELEASE_PUBLISHER 仓库变量。"
          }
          $validation = @{
            Version = $env:VERSION
            Publisher = $env:PUBLISHER
            OcrManifestKeyId = $env:OCR_MANIFEST_KEY_ID
            OcrManifestPublicKeyHex = $env:OCR_MANIFEST_PUBLIC_KEY_HEX
            RequireSbom = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNER_SHA256)) {
            $validation.SignerSha256 = $env:SIGNER_SHA256
          }
          if ($env:REQUIRE_TRUSTED_SIGNATURE -eq "true") {
            $validation.RequireTrustedSignature = $true
          }
          .\scripts\validate-package.ps1 @validation
          .\scripts\smoke-ocr.ps1 `
            -OcrRoot "dist/site/ocr/rapidocr-onnx" `
            -HelperPath "dist/site/AirScreenshot.exe"
          .\scripts\smoke-portable.ps1 -Executable "dist/site/AirScreenshot.exe"
          .\scripts\smoke-lifecycle.ps1 -Executable "dist/site/AirScreenshot.exe"

      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.run_id }}
          path: |
            dist/site
            dist/release-assets
          compression-level: 0
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Attest and stage release
    needs:
      - build
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.run_id }}
          path: dist

      - name: Attest signed release provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/site/AirScreenshot.exe
            dist/site/ocr-dependencies.json
            dist/site/ocr-dependencies.json.sig
            dist/site/ocr/rapidocr-onnx/.airshot-manifest.json
            dist/site/ocr/rapidocr-onnx/.airshot-manifest.sig
            dist/site/ocr/rapidocr-onnx/rapidocr_runner.exe
            dist/release-assets/AirScreenshot.pdb
            dist/release-assets/AirScreenshot.spdx.json
            dist/release-assets/SHA256SUMS.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  deploy:
    name: Deploy download site
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.run_id }}
          path: dist

      - name: Validate release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test -f dist/site/.nojekyll

          read_git_object() {
            local endpoint="$1"
            local response
            response="$(gh api "$endpoint")"
            object_type="$(jq -er '.object.type' <<<"$response")"
            object_sha="$(jq -er '.object.sha' <<<"$response")"
            if [[ ! "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Git Data API returned an invalid object SHA for $endpoint." >&2
              exit 1
            fi
          }

          version_is_greater() {
            local left_version="$1"
            local right_version="$2"
            local left_major left_minor left_patch
            local right_major right_minor right_patch
            local -a left_parts right_parts
            local index left_part right_part

            IFS=. read -r left_major left_minor left_patch <<<"$left_version"
            IFS=. read -r right_major right_minor right_patch <<<"$right_version"
            left_parts=("$left_major" "$left_minor" "$left_patch")
            right_parts=("$right_major" "$right_minor" "$right_patch")
            for index in 0 1 2; do
              left_part="${left_parts[$index]}"
              right_part="${right_parts[$index]}"
              if (( ${#left_part} > ${#right_part} )); then
                return 0
              fi
              if (( ${#left_part} < ${#right_part} )); then
                return 1
              fi
              if [[ "$left_part" > "$right_part" ]]; then
                return 0
              fi
              if [[ "$left_part" < "$right_part" ]]; then
                return 1
              fi
            done
            return 1
          }

          read_git_object \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
          depth=0
          # object_type is text; an arithmetic loop treats "tag" as an
          # unset variable when nounset is enabled.
          while [[ "$depth" -lt 16 && "$object_type" == "tag" ]]; do
            read_git_object \
              "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
            depth=$((depth + 1))
          done
          if [[ "$object_type" != "commit" ]]; then
            echo "Tag did not resolve to a commit within 16 annotated tag objects." >&2
            exit 1
          fi
          if [[ "${object_sha,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "Tag resolves to $object_sha, not workflow commit $GITHUB_SHA." >&2
            exit 1
          fi

          release_exists=false
          if gh release view "$GITHUB_REF_NAME" \
               --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          published_tags="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | .tag_name')"
          highest_version=""
          while IFS= read -r release_tag; do
            if [[ "$release_exists" = true && "$release_tag" = "$GITHUB_REF_NAME" ]]; then
              continue
            fi
            if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              continue
            fi
            release_version="${release_tag#v}"
            if [[ -z "$highest_version" ]] ||
               version_is_greater "$release_version" "$highest_version"; then
              highest_version="$release_version"
            fi
          done <<<"$published_tags"
          if [[ -n "$highest_version" ]] &&
             ! version_is_greater "$VERSION" "$highest_version"; then
            echo "Version $VERSION must be greater than published release $highest_version." >&2
            exit 1
          fi

          if [[ "$release_exists" = true ]]; then
            release_metadata="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,assets)"
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
              <<<"$release_metadata" >/dev/null
            assets="$(jq -c '[.assets[].name] | sort' <<<"$release_metadata")"
            expected_assets='["AirScreenshot.exe","AirScreenshot.pdb","AirScreenshot.spdx.json","LICENSE","SHA256SUMS.txt","THIRD_PARTY_NOTICES.md","ocr-dependencies.json","ocr-dependencies.json.sig"]'
            if [[ "$assets" != "$expected_assets" ]]; then
              echo "Existing release assets do not match the immutable release contract." >&2
              exit 1
            fi

            release_temp="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$release_temp"
            release_names=(
              AirScreenshot.exe
              AirScreenshot.pdb
              AirScreenshot.spdx.json
              LICENSE
              SHA256SUMS.txt
              THIRD_PARTY_NOTICES.md
              ocr-dependencies.json
              ocr-dependencies.json.sig
            )
            source_paths=(
              dist/site/AirScreenshot.exe
              dist/release-assets/AirScreenshot.pdb
              dist/release-assets/AirScreenshot.spdx.json
              dist/release-assets/LICENSE
              dist/release-assets/SHA256SUMS.txt
              dist/release-assets/THIRD_PARTY_NOTICES.md
              dist/site/ocr-dependencies.json
              dist/site/ocr-dependencies.json.sig
            )
            for index in "${!release_names[@]}"; do
              if ! cmp --silent \
                   "${source_paths[$index]}" \
                   "$release_temp/${release_names[$index]}"; then
                echo "Existing immutable release differs from this run: ${release_names[$index]}" >&2
                exit 1
              fi
            done
          fi
          echo "exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Create GitHub Release
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/site/AirScreenshot.exe \
            dist/site/ocr-dependencies.json \
            dist/site/ocr-dependencies.json.sig \
            dist/release-assets/AirScreenshot.pdb \
            dist/release-assets/AirScreenshot.spdx.json \
            dist/release-assets/LICENSE \
            dist/release-assets/SHA256SUMS.txt \
            dist/release-assets/THIRD_PARTY_NOTICES.md \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Air Screenshot $VERSION" \
            --generate-notes \
            --notes "下载 AirScreenshot.exe，双击即可运行，无需安装。"

      - name: Verify public release and download entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_MANIFEST_KEY_ID: ${{ vars.OCR_MANIFEST_KEY_ID }}
          OCR_MANIFEST_PUBLIC_KEY_HEX: ${{ vars.OCR_MANIFEST_PUBLIC_KEY_HEX }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ocr_payload_dir="$(mktemp -d)"

          valid_ocr_manifest_path() {
            local file_path="$1"
            local component stem upper
            local -a components

            if [[ -z "$file_path" || ${#file_path} -gt 240 ||
                  ! "$file_path" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
              return 1
            fi
            IFS=/ read -r -a components <<<"$file_path"
            for component in "${components[@]}"; do
              if [[ "$component" == "." || "$component" == ".." ||
                    "$component" == *. ]]; then
                return 1
              fi
              stem="${component%%.*}"
              upper="${stem^^}"
              case "$upper" in
                CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9]) return 1 ;;
              esac
            done
            return 0
          }

          verify_ocr_payload() {
            local target_root="$1"
            local downloaded_count=0
            local file_path file_url file_sha256 file_size
            local expected_url target_path partial_path actual_sha256 actual_size

            while IFS=$'\t' read -r \
                file_path file_url file_sha256 file_size; do
              if ! valid_ocr_manifest_path "$file_path"; then
                echo "Invalid OCR manifest path: $file_path" >&2
                return 1
              fi
              expected_url="https://mmm1h.github.io/air-screenshot/ocr/rapidocr-onnx/$file_path"
              if [[ "$file_url" != "$expected_url" ]] ||
                 [[ ! "$file_sha256" =~ ^[0-9a-f]{64}$ ]] ||
                 [[ ! "$file_size" =~ ^[1-9][0-9]*$ ]]; then
                echo "Invalid OCR manifest metadata for: $file_path" >&2
                return 1
              fi

              target_path="$target_root/$file_path"
              mkdir -p "$(dirname "$target_path")"
              if [[ -f "$target_path" ]]; then
                actual_sha256="$(sha256sum "$target_path" | cut -d' ' -f1)"
                actual_size="$(stat -c%s "$target_path")"
                if [[ "$actual_sha256" = "$file_sha256" ]] &&
                   [[ "$actual_size" = "$file_size" ]]; then
                  downloaded_count=$((downloaded_count + 1))
                  continue
                fi
              fi

              partial_path="$target_path.part"
              if ! curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 10 --max-time 180 \
                   -H 'Cache-Control: no-cache' \
                   -o "$partial_path" "$file_url"; then
                echo "Failed to download OCR payload file: $file_url" >&2
                return 1
              fi
              actual_sha256="$(sha256sum "$partial_path" | cut -d' ' -f1)"
              actual_size="$(stat -c%s "$partial_path")"
              if [[ "$actual_sha256" != "$file_sha256" ]] ||
                 [[ "$actual_size" != "$file_size" ]]; then
                echo "OCR payload hash or size mismatch: $file_path" >&2
                return 1
              fi
              mv -f "$partial_path" "$target_path"
              downloaded_count=$((downloaded_count + 1))
            done < <(jq -r \
              '.files[] | [.path, .url, (.sha256 | ascii_downcase), (.size | tostring)] | @tsv' \
              ocr-dependencies.json)

            [[ "$downloaded_count" = "$ocr_file_count" ]]
          }

          assets="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name] | sort')"
          expected_assets='["AirScreenshot.exe","AirScreenshot.pdb","AirScreenshot.spdx.json","LICENSE","SHA256SUMS.txt","THIRD_PARTY_NOTICES.md","ocr-dependencies.json","ocr-dependencies.json.sig"]'
          test "$assets" = "$expected_assets"

          for attempt in {1..30}; do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 10 --max-time 120 \
                 -H 'Cache-Control: no-cache' -o latest.json \
                 "https://mmm1h.github.io/air-screenshot/latest.json" &&
               curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 10 --max-time 120 \
                 -H 'Cache-Control: no-cache' -o index.html \
                 "https://mmm1h.github.io/air-screenshot/" &&
               curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 10 --max-time 120 \
                 -H 'Cache-Control: no-cache' -o ocr-dependencies.json \
                 "https://mmm1h.github.io/air-screenshot/ocr-dependencies.json" &&
               curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 10 --max-time 120 \
                 -H 'Cache-Control: no-cache' -o ocr-dependencies.json.sig \
                 "https://mmm1h.github.io/air-screenshot/ocr-dependencies.json.sig"; then
              download_url="$(jq -r '.url' latest.json)"
              expected_sha256="$(jq -r '.sha256 | ascii_downcase' latest.json)"
              expected_size="$(jq -r '.size' latest.json)"
              ocr_package_id="$(jq -r '.packageId' ocr-dependencies.json)"
              ocr_schema_version="$(jq -r '.schemaVersion' ocr-dependencies.json)"
              ocr_sequence="$(jq -r '.sequence' ocr-dependencies.json)"
              ocr_issued_at="$(jq -r '.issuedAt' ocr-dependencies.json)"
              ocr_expires_at="$(jq -r '.expiresAt' ocr-dependencies.json)"
              ocr_file_count="$(jq -r '.files | length' ocr-dependencies.json)"
              ocr_zero_hash_count="$(jq -r '[.files[] | select(.sha256 == ("0" * 64))] | length' ocr-dependencies.json)"
              ocr_zero_size_count="$(jq -r '[.files[] | select(.size == 0)] | length' ocr-dependencies.json)"
              ocr_runner_sha256="$(jq -r '.files[] | select(.path == "rapidocr_runner.exe") | .sha256 | ascii_downcase' ocr-dependencies.json)"
              ocr_runner_size="$(jq -r '.files[] | select(.path == "rapidocr_runner.exe") | .size' ocr-dependencies.json)"
              ocr_signature_key_id="$(jq -r '.keyId' ocr-dependencies.json.sig)"
              ocr_signature_length="$(jq -r '.signature | length' ocr-dependencies.json.sig)"

              curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 10 --max-time 180 \
                -H 'Cache-Control: no-cache' \
                -o AirScreenshot.exe "$download_url" || true
              actual_sha256="$(sha256sum AirScreenshot.exe 2>/dev/null | cut -d' ' -f1 || true)"
              actual_size="$(stat -c%s AirScreenshot.exe 2>/dev/null || true)"
              IFS=. read -r version_major version_minor version_patch <<< "$VERSION"
              expected_ocr_sequence="$((10#$version_major * 1000000000000 + 10#$version_minor * 1000000 + 10#$version_patch))"
              now="$(date +%s)"

              if ! OCR_MANIFEST_KEY_ID="$OCR_MANIFEST_KEY_ID" \
                   OCR_MANIFEST_PUBLIC_KEY_HEX="$OCR_MANIFEST_PUBLIC_KEY_HEX" \
                   node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const signatureDocument = JSON.parse(
            fs.readFileSync("ocr-dependencies.json.sig", "utf8")
          );
          const publicKey = process.env.OCR_MANIFEST_PUBLIC_KEY_HEX || "";
          if (!/^[0-9a-fA-F]{128}$/.test(publicKey) ||
              signatureDocument.keyId !== process.env.OCR_MANIFEST_KEY_ID ||
              !/^[0-9a-fA-F]{128}$/.test(signatureDocument.signature || "")) {
            process.exit(1);
          }
          const point = Buffer.from(publicKey, "hex");
          const base64url = value => value.toString("base64url");
          const key = crypto.createPublicKey({
            key: {
              kty: "EC",
              crv: "P-256",
              x: base64url(point.subarray(0, 32)),
              y: base64url(point.subarray(32))
            },
            format: "jwk"
          });
          const verified = crypto.verify(
            "sha256",
            fs.readFileSync("ocr-dependencies.json"),
            { key, dsaEncoding: "ieee-p1363" },
            Buffer.from(signatureDocument.signature, "hex")
          );
          process.exit(verified ? 0 : 1);
          NODE
              then
                sleep 10
                continue
              fi

              if ! verify_ocr_payload "$ocr_payload_dir"; then
                sleep 10
                continue
              fi
              actual_runner_sha256="$(sha256sum \
                "$ocr_payload_dir/rapidocr_runner.exe" | cut -d' ' -f1)"
              actual_runner_size="$(stat -c%s \
                "$ocr_payload_dir/rapidocr_runner.exe")"

              if [[ "$(jq -r '.version' latest.json)" = "$VERSION" ]] &&
                 [[ "$download_url" = "https://mmm1h.github.io/air-screenshot/AirScreenshot.exe" ]] &&
                 cmp --silent latest.json dist/site/latest.json &&
                 cmp --silent index.html dist/site/index.html &&
                 cmp --silent AirScreenshot.exe dist/site/AirScreenshot.exe &&
                 cmp --silent ocr-dependencies.json dist/site/ocr-dependencies.json &&
                 cmp --silent ocr-dependencies.json.sig dist/site/ocr-dependencies.json.sig &&
                 [[ "$actual_sha256" = "$expected_sha256" ]] &&
                 [[ "$actual_size" = "$expected_size" ]] &&
                 [[ "$ocr_package_id" = "rapidocr-onnx" ]] &&
                 [[ "$ocr_schema_version" = 1 ]] &&
                 [[ "$ocr_sequence" = "$expected_ocr_sequence" ]] &&
                 [[ "$ocr_issued_at" -le "$((now + 300))" ]] &&
                 [[ "$ocr_expires_at" -gt "$now" ]] &&
                 [[ "$((ocr_expires_at - ocr_issued_at))" = 15552000 ]] &&
                 [[ "$ocr_file_count" -ge 26 ]] &&
                 [[ "$ocr_zero_hash_count" = 0 ]] &&
                 [[ "$ocr_zero_size_count" = 0 ]] &&
                 [[ "$ocr_signature_key_id" = "$OCR_MANIFEST_KEY_ID" ]] &&
                 [[ "$ocr_signature_length" = 128 ]] &&
                 [[ "$actual_runner_sha256" = "$ocr_runner_sha256" ]] &&
                 [[ "$actual_runner_size" = "$ocr_runner_size" ]] &&
                 grep -q "AirScreenshot.exe" index.html &&
                 ! grep -Eqi 'airshot_ocr\.exe|msix|appinstaller|Install-AirScreenshot' index.html &&
                 gh attestation verify AirScreenshot.exe \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                   --source-ref "$GITHUB_REF" \
                   --source-digest "$GITHUB_SHA" >/dev/null &&
                 gh attestation verify ocr-dependencies.json \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                   --source-ref "$GITHUB_REF" \
                   --source-digest "$GITHUB_SHA" >/dev/null &&
                 gh attestation verify ocr-dependencies.json.sig \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                   --source-ref "$GITHUB_REF" \
                   --source-digest "$GITHUB_SHA" >/dev/null &&
                  gh attestation verify "$ocr_payload_dir/rapidocr_runner.exe" \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                   --source-ref "$GITHUB_REF" \
                   --source-digest "$GITHUB_SHA" >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "公开 Release、下载页或 latest.json 未更新到 $VERSION。" >&2
          exit 1
