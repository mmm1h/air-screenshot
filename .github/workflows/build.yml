name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Rust for the native OCR worker
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup component add clippy rustfmt --toolchain 1.88.0-x86_64-pc-windows-msvc
          rustup override set 1.88.0

      - name: Build and test
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: .\scripts\test.ps1 -Configuration $env:CONFIGURATION

      - name: Exercise host lifecycle
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: .\scripts\smoke-lifecycle.ps1
