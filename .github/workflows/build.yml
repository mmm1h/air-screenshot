name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Python for OCR tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          architecture: "x64"

      - name: Build and test
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: .\scripts\test.ps1 -Configuration $env:CONFIGURATION

      - name: Exercise host lifecycle
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: .\scripts\smoke-lifecycle.ps1
